<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحب - بحبك يكوتي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Great+Vibes&family=Reem+Kufi:wght@500;700;800&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #2a0818 0%, #0a0106 100%);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Cairo', 'Reem Kufi', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* Canvas Overlay */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Screen Wrapper */
        .app-card {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 105, 180, 0.25);
            border-radius: 28px;
            padding: 2.2rem 1.8rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 20, 147, 0.2);
            text-align: center;
            transition: all 0.5s ease;
        }

        /* Screen States */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.92) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Typography & Glows */
        .game-title {
            font-size: 2.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #ff69b4 60%, #ff1493 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.4);
            margin-bottom: 0.5rem;
        }

        .game-desc {
            color: #e2b6cf;
            font-size: 1rem;
            margin-bottom: 1.8rem;
            line-height: 1.6;
        }

        /* Custom Shiny Button */
        .glow-btn {
            background: linear-gradient(135deg, #ff1493 0%, #d8006f 100%);
            color: white;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 0.85rem 2.2rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 20, 147, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .glow-btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 12px 35px rgba(255, 20, 147, 0.8);
        }

        .glow-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Progress Bar */
        .meter-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 105, 180, 0.3);
            border-radius: 20px;
            height: 22px;
            padding: 3px;
            margin: 1.2rem 0;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff69b4, #ff1493, #ff0055);
            border-radius: 16px;
            transition: width 0.3s ease;
            box-shadow: 0 0 12px rgba(255, 20, 147, 0.8);
        }

        /* Heart Canvas Arena */
        .game-arena {
            position: relative;
            width: 100%;
            height: 320px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px dashed rgba(255, 105, 180, 0.3);
            overflow: hidden;
            cursor: pointer;
        }

        /* Floating Catchable Target */
        .catch-item {
            position: absolute;
            font-size: 2.8rem;
            cursor: pointer;
            user-select: none;
            filter: drop-shadow(0 0 12px rgba(255, 20, 147, 0.9));
            transition: transform 0.15s ease;
            animation: pulseTarget 1.2s ease-in-out infinite alternate;
        }

        @keyframes pulseTarget {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.15); }
        }

        /* Final Heart Display */
        .heart-box {
            position: relative;
            width: 260px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulseGlow 2s ease-in-out infinite alternate;
            margin: 0.5rem 0;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.96);
                filter: drop-shadow(0 0 18px rgba(255, 20, 147, 0.6));
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 40px rgba(255, 20, 147, 1)) drop-shadow(0 0 60px rgba(255, 105, 180, 0.8));
            }
        }

        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .heart-text-inside {
            position: absolute;
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: #ffffff;
            text-shadow: 
                0 0 10px #ff1493,
                0 0 20px #ff1493,
                0 0 35px #ff69b4;
            animation: textFloat 3s ease-in-out infinite;
            z-index: 15;
            letter-spacing: 2px;
        }

        @keyframes textFloat {
            0%, 100% { transform: translateY(0) scale(1) rotate(-3deg); }
            50% { transform: translateY(-7px) scale(1.08) rotate(3deg); }
        }

        /* Final Arabic Text */
        .arabic-glow {
            font-family: 'Amiri', serif;
            font-weight: 700;
            font-size: 3.2rem;
            color: #fff;
            text-shadow: 
                0 0 12px #ff1493,
                0 0 25px #ff1493,
                0 0 40px #e60073,
                0 0 60px #ff0055;
            letter-spacing: 2px;
            margin-top: 0.5rem;
            margin-bottom: 0.2rem;
        }

        .subtitle {
            color: #ffb6c1;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }

        /* Score floating popup */
        .score-pop {
            position: absolute;
            color: #ff69b4;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: popUp 0.8s ease-out forwards;
            text-shadow: 0 0 8px #ff1493;
        }

        @keyframes popUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
        }
    </style>
</head>
<body>

    <!-- Background Particle Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Main Game Box -->
    <div class="app-card">
        
        <!-- SCREEN 1: START SCREEN -->
        <div id="startScreen" class="screen active">
            <div class="text-5xl mb-3 animate-bounce">💖</div>
            <h1 class="game-title">لعبة الحب والقلوب</h1>
            <p class="game-desc">
                اجمعي القلوب المضيئة واملئي "عداد الحب" لاكتشاف الرسالة السرية الخاصة بكِ! ✨
            </p>
            <button class="glow-btn" id="startBtn">
                <span>ابدأي اللعب الآن</span>
                <span>✨</span>
            </button>
        </div>

        <!-- SCREEN 2: GAMEPLAY SCREEN -->
        <div id="gameScreen" class="screen">
            <div class="flex justify-between items-center w-full mb-1 text-sm text-pink-200 font-bold">
                <span>عداد الحب 💖</span>
                <span id="scoreText">0 / 10</span>
            </div>
            
            <div class="meter-container">
                <div class="meter-fill" id="meterFill"></div>
            </div>

            <!-- Heart Catching Arena -->
            <div class="game-arena" id="arena">
                <!-- Floating hearts will spawn dynamically here -->
            </div>
        </div>

        <!-- SCREEN 3: FINAL REVEAL SCREEN -->
        <div id="winScreen" class="screen">
            <div class="text-xs tracking-widest text-pink-300 font-bold mb-1 uppercase opacity-90">Secret Message Unlocked</div>
            
            <!-- Heart Canvas -->
            <div class="heart-box">
                <canvas id="heartCanvas"></canvas>
                <div class="heart-text-inside">Love You</div>
            </div>

            <!-- Arabic Message -->
            <h1 class="arabic-glow">بحبك يكوتي </h1>
            <p class="subtitle">✨ أنتِ كل أوقاتي وحياتي ✨</p>

            <button class="glow-btn mt-2" id="replayBtn">
                <span>إعادة اللعب 🔄</span>
            </button>
        </div>

    </div>

    <script>
        // --- Web Audio API (Synthesized Soft Sound Effects) ---
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playPop() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.12);
                    
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                } catch(e) {}
            }

            playWin() {
                if (!this.ctx) return;
                try {
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
                        
                        gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.3);
                        
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        
                        osc.start(this.ctx.currentTime + idx * 0.1);
                        osc.stop(this.ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } catch(e) {}
            }
        }

        const soundFX = new SoundFX();

        // --- Background Particle Canvas System ---
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');

        function resizeBgCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBgCanvas);
        resizeBgCanvas();

        const bgParticles = [];
        class AmbientParticle {
            constructor(x, y, isConfetti = false) {
                this.x = x || Math.random() * bgCanvas.width;
                this.y = y || (isConfetti ? y : bgCanvas.height + 20);
                this.size = Math.random() * (isConfetti ? 12 : 8) + 4;
                this.speedY = isConfetti ? (Math.random() - 0.5) * 8 - 2 : -(Math.random() * 1.5 + 0.5);
                this.speedX = isConfetti ? (Math.random() - 0.5) * 8 : (Math.random() - 0.5) * 0.8;
                this.opacity = 1;
                this.fade = isConfetti ? Math.random() * 0.015 + 0.008 : 0;
                this.color = `hsl(${320 + Math.random() * 40}, 100%, ${65 + Math.random() * 25}%)`;
                this.isHeart = Math.random() > 0.4;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.08;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotSpeed;

                if (this.fade > 0) {
                    this.opacity -= this.fade;
                } else if (this.y < -20) {
                    this.y = bgCanvas.height + 20;
                    this.x = Math.random() * bgCanvas.width;
                }
            }

            draw(ctx) {
                if (this.opacity <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;

                if (this.isHeart) {
                    ctx.beginPath();
                    const h = this.size * 0.3;
                    ctx.moveTo(0, h);
                    ctx.bezierCurveTo(0, 0, -this.size/2, 0, -this.size/2, h);
                    ctx.bezierCurveTo(-this.size/2, (this.size + h)/2, 0, this.size, 0, this.size);
                    ctx.bezierCurveTo(0, this.size, this.size/2, (this.size + h)/2, this.size/2, h);
                    ctx.bezierCurveTo(this.size/2, 0, 0, 0, 0, h);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        for (let i = 0; i < 50; i++) {
            bgParticles.push(new AmbientParticle());
        }

        function animateBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            for (let i = bgParticles.length - 1; i >= 0; i--) {
                const p = bgParticles[i];
                p.update();
                p.draw(bgCtx);
                if (p.opacity <= 0) bgParticles.splice(i, 1);
            }
            while (bgParticles.length < 50) {
                bgParticles.push(new AmbientParticle());
            }
            requestAnimationFrame(animateBg);
        }
        animateBg();

        function triggerVictoryConfetti() {
            for (let i = 0; i < 120; i++) {
                bgParticles.push(new AmbientParticle(
                    bgCanvas.width / 2 + (Math.random() - 0.5) * 100,
                    bgCanvas.height / 2 + (Math.random() - 0.5) * 100,
                    true
                ));
            }
        }

        // --- Game Logic ---
        const TARGET_SCORE = 10;
        let score = 0;
        let spawnInterval = null;

        const startScreen = document.getElementById('startScreen');
        const gameScreen = document.getElementById('gameScreen');
        const winScreen = document.getElementById('winScreen');
        
        const startBtn = document.getElementById('startBtn');
        const replayBtn = document.getElementById('replayBtn');
        const arena = document.getElementById('arena');
        const meterFill = document.getElementById('meterFill');
        const scoreText = document.getElementById('scoreText');

        const heartIcons = ['💖', '💕', '💗', '💓', '🎁', '✨', '🌸'];

        function showScreen(screen) {
            [startScreen, gameScreen, winScreen].forEach(s => s.classList.remove('active'));
            screen.classList.add('active');
        }

        function startGame() {
            soundFX.init();
            score = 0;
            updateMeter();
            arena.innerHTML = '';
            showScreen(gameScreen);
            
            spawnHeart();
            spawnInterval = setInterval(spawnHeart, 700);
        }

        function updateMeter() {
            const percent = (score / TARGET_SCORE) * 100;
            meterFill.style.width = `${percent}%`;
            scoreText.textContent = `${score} / ${TARGET_SCORE}`;
        }

        function spawnHeart() {
            if (score >= TARGET_SCORE) return;

            const target = document.createElement('div');
            target.className = 'catch-item';
            target.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            
            const arenaRect = arena.getBoundingClientRect();
            const maxX = arenaRect.width - 60;
            const maxY = arenaRect.height - 60;
            
            const x = Math.max(10, Math.random() * maxX);
            const y = Math.max(10, Math.random() * maxY);

            target.style.left = `${x}px`;
            target.style.top = `${y}px`;

            // Click / Tap Handler
            const catchHandler = (e) => {
                e.stopPropagation();
                soundFX.playPop();
                
                score++;
                updateMeter();

                // Floating Score Text
                const pop = document.createElement('div');
                pop.className = 'score-pop';
                pop.textContent = '+1 💖';
                pop.style.left = `${x}px`;
                pop.style.top = `${y}px`;
                arena.appendChild(pop);
                setTimeout(() => pop.remove(), 800);

                target.remove();

                if (score >= TARGET_SCORE) {
                    endGame();
                }
            };

            target.addEventListener('mousedown', catchHandler);
            target.addEventListener('touchstart', catchHandler, { passive: true });

            arena.appendChild(target);

            // Auto remove unclicked after timeout
            setTimeout(() => {
                if (target.parentNode === arena) {
                    target.style.opacity = '0';
                    target.style.transition = 'opacity 0.3s';
                    setTimeout(() => target.remove(), 300);
                }
            }, 1800);
        }

        function endGame() {
            clearInterval(spawnInterval);
            soundFX.playWin();
            triggerVictoryConfetti();

            setTimeout(() => {
                showScreen(winScreen);
                initFinalHeartCanvas();
            }, 400);
        }

        startBtn.addEventListener('click', startGame);
        replayBtn.addEventListener('click', startGame);

        // --- Final Screen Animated Heart Engine ---
        const heartCanvas = document.getElementById('heartCanvas');
        const heartCtx = heartCanvas.getContext('2d');

        const heartPoints = [];
        const numHeartPoints = 100;
        for (let i = 0; i < numHeartPoints; i++) {
            const step = (i / numHeartPoints) * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(step), 3);
            const y = -(13 * Math.cos(step) - 5 * Math.cos(2 * step) - 2 * Math.cos(3 * step) - Math.cos(4 * step));
            heartPoints.push({ x, y });
        }

        class HeartParticle {
            constructor(targetX, targetY) {
                this.baseX = targetX;
                this.baseY = targetY;
                this.x = targetX + (Math.random() - 0.5) * 15;
                this.y = targetY + (Math.random() - 0.5) * 15;
                this.size = Math.random() * 2 + 1.2;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.color = `hsla(${330 + Math.random() * 30}, 100%, ${65 + Math.random() * 25}%, ${0.7 + Math.random() * 0.3})`;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                const dx = this.baseX - this.x;
                const dy = this.baseY - this.y;
                this.x += dx * 0.06;
                this.y += dy * 0.06;
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ff1493';
                ctx.fill();
            }
        }

        let heartParticles = [];
        let heartAnimId = null;

        function initFinalHeartCanvas() {
            const rect = heartCanvas.parentElement.getBoundingClientRect();
            heartCanvas.width = rect.width;
            heartCanvas.height = rect.height;

            heartParticles = [];
            const centerX = heartCanvas.width / 2;
            const centerY = heartCanvas.height / 2 - 5;
            const scale = Math.min(heartCanvas.width, heartCanvas.height) / 38;

            heartPoints.forEach(pt => {
                const px = centerX + pt.x * scale;
                const py = centerY + pt.y * scale;
                heartParticles.push(new HeartParticle(px, py));
                heartParticles.push(new HeartParticle(px + (Math.random() - 0.5) * 8, py + (Math.random() - 0.5) * 8));
            });

            if (heartAnimId) cancelAnimationFrame(heartAnimId);
            animateFinalHeart();
        }

        function animateFinalHeart() {
            heartCtx.clearRect(0, 0, heartCanvas.width, heartCanvas.height);
            
            // Connect points with romantic glowing lines
            heartCtx.beginPath();
            for (let i = 0; i < heartParticles.length; i++) {
                const p1 = heartParticles[i];
                const p2 = heartParticles[(i + 1) % heartParticles.length];
                heartCtx.strokeStyle = 'rgba(255, 20, 147, 0.18)';
                heartCtx.lineWidth = 1;
                heartCtx.moveTo(p1.x, p1.y);
                heartCtx.lineTo(p2.x, p2.y);
            }
            heartCtx.stroke();

            heartParticles.forEach(p => {
                p.update();
                p.draw(heartCtx);
            });

            heartAnimId = requestAnimationFrame(animateFinalHeart);
        }
    </script>
</body>
</html>
